services:
  pdf-validation:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    environment:
      MAX_FILE_SIZE_MIB: "20"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
